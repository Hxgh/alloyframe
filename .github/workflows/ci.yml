name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm validate
      # 校验仓库中的公开数据（与 AGENTS.md 的数据维护命令一致）；test 已断言 initialFiles 与 data/ 树同步。
      - run: ALLOYFRAME_DATA_DIR="$PWD/data" pnpm validate
      - run: pnpm build
